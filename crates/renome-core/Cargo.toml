[package]
name = "renome-core"
version = "0.5.1"
edition = "2024"
license = "MIT"
description = "Renome core: renaming rules, preview and safe apply"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
globset = "0.4"
kamadak-exif = "0.6"
lofty = "0.25.4"
regex = "1"
rusty-chromaprint = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
symphonia = { version = "0.6", features = ["mp3", "aac", "isomp4", "alac", "aiff"] }
unicode-normalization = "0.1"
unicode-segmentation = "1"
walkdir = "2"
xxhash-rust = { version = "0.8", features = ["xxh3"] }

[dev-dependencies]
tempfile = "3"
