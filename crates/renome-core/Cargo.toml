[package]
name = "renome-core"
version = "0.17.0"
edition = "2024"
license = "MIT"
description = "Renome core: renaming rules, preview and safe apply"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
encoding_rs = "0.8"
globset = "0.4"
kamadak-exif = "0.6"
lofty = "0.25.4"
lopdf = { version = "0.46", default-features = false }
regex = "1"
roxmltree = "0.21"
rusty-chromaprint = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sevenz-rust2 = { version = "0.24", default-features = false }
symphonia = { version = "0.6", features = ["mp3", "aac", "isomp4", "alac", "aiff"] }
tar = { version = "0.4", default-features = false }
unicode-normalization = "0.1"
unicode-segmentation = "1"
walkdir = "2"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
zip = { version = "9", default-features = false, features = ["deflate"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
