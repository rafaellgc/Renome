[package]
name = "renome-core"
version = "0.26.0"
edition = "2024"
license = "MIT"
description = "Renome core: renaming rules, preview and safe apply"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
encoding_rs = "0.8"
fax = "0.3.0"
globset = "0.4"
hayro = "0.9.0"
hayro-jbig2 = "0.4.0"
hayro-jpeg2000 = "0.5.0"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp", "tiff"] }
kamadak-exif = "0.6"
lofty = "0.25.4"
lopdf = { version = "0.46", default-features = false }
png = "0.18"
regex = "1"
renome-archive = { path = "../renome-archive" }
roxmltree = "0.21"
rxing = { version = "0.9.3", default-features = false, features = ["oned", "decoders", "encoding_rs"] }
rusty-chromaprint = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sevenz-rust2 = { version = "0.24", default-features = false }
symphonia = { version = "0.6", features = ["mp3", "aac", "isomp4", "alac", "aiff"] }
tar = { version = "0.4", default-features = false }
trash = "5"
turbojpeg = { version = "1.5.1", default-features = false, features = ["cmake"] }
unicode-normalization = "0.1"
unicode-segmentation = "1"
walkdir = "2"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
zip = { version = "9", default-features = false, features = ["deflate"] }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
