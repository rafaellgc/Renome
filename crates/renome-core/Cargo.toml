[package]
name = "renome-core"
version = "0.1.5"
edition = "2024"
license = "MIT"
description = "Renome core: renaming rules, preview and safe apply"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
globset = "0.4"
kamadak-exif = "0.6"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-normalization = "0.1"
unicode-segmentation = "1"
walkdir = "2"

[dev-dependencies]
tempfile = "3"
