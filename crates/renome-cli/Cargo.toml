[package]
name = "renome-cli"
version = "0.38.1"
edition = "2024"
license = "MIT"
description = "Renome on the command line: the window's rules, lookups, history and options from a terminal"

[[bin]]
name = "renome-cli"
path = "src/main.rs"

[dependencies]
renome-core = { path = "../renome-core" }
renome-services = { path = "../renome-services" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["string", "wrap_help"] }
clap_complete = "4"
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync"] }
chrono = "0.4"
rpassword = "7"
ctrlc = "3"
clap_mangen = "0.2"
terminal_size = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
minisign-verify = "0.3"
semver = "1"
flate2 = "1"
tar = "0.4"
base64 = "0.22"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[build-dependencies]
serde_json = "1"

[dev-dependencies]
tempfile = "3"
