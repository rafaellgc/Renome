[package]
name = "renome-services"
version = "0.38.1"
edition = "2024"
license = "MIT"
description = "Renome services: online catalogues, keys, kept answers and data folders, shared by the window and the command line"

[dependencies]
renome-core = { path = "../renome-core" }
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
futures-util = "0.3"
tokio = { version = "1", features = ["time", "sync", "rt"] }
keyring = "4"
chrono = "0.4"
regex = "1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["time", "sync", "rt", "rt-multi-thread", "macros"] }
