# Builds Renome for Linux, Windows and macOS.
# - On every push/PR (and pushes to test-* branches): builds and tests, and keeps the installers as run
#   artifacts (Actions tab → run → Artifacts).
# - When a v* tag is pushed (e.g. v0.2.0): creates a draft GitHub Release
#   with all the installers attached, a Flatpak bundle included (also made
#   when the workflow is run by hand), and updates the Flatpak repository
#   served from GitHub Pages (gh-pages branch).
name: build

on:
  push:
    branches: [main, "test-*"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p renome-core

  # The same tests on Windows and macOS (renaming works differently there);
  # they do not hold the builds back.
  test-other:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p renome-core

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            args: ""
          - os: windows-latest
            args: ""
          - os: macos-latest
            args: "--target universal-apple-darwin"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf rpm

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: "Renome ${{ github.ref_name }}"
          releaseBody: |
            **Downloads**
            - Linux: `.AppImage` (any distro), `.flatpak`, `.deb` or `.rpm`
            - Windows: `_x64-setup.exe` (or `.msi`)
            - macOS: `_universal.dmg` (Intel and Apple Silicon)

            The installers are not signed, so Windows and macOS will show a warning the first time. On macOS, right-click the app and choose **Open**.

            Flatpak: `flatpak install --user https://rafaellgc.github.io/Renome/io.github.rafaellgc.Renome.flatpakref` (updates itself), or install the `.flatpak` file.
          releaseDraft: true

      # The system's password store, and the program opening with keys in
      # its settings file (from before the store): they must move to the
      # store. A picture of the screen is kept with the installers.
      - name: Password store test
        if: runner.os != 'Linux'
        run: cargo test -p renome --lib secrets -- --ignored

      - name: Run the program (macOS)
        if: runner.os == 'macOS'
        continue-on-error: true
        run: |
          dir="$HOME/Library/Application Support/renome"
          mkdir -p "$dir"
          echo '{"lang":"pt","tmdbKey":"ci-fake-key","rules":[],"columns":[]}' > "$dir/settings.json"
          app=$(find target -path '*bundle/macos/Renome.app' -maxdepth 6 | head -1)
          "$app/Contents/MacOS/renome" &
          sleep 20
          mkdir -p shots
          screencapture -x shots/macos.png || true
          cat "$dir/settings.json"
          if grep -q ci-fake-key "$dir/settings.json"; then exit 1; fi
          security find-generic-password -s io.github.rafaellgc.Renome -a credentials

      - name: Run the program (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          $dir = "$env:APPDATA\renome"
          New-Item -ItemType Directory -Force $dir | Out-Null
          '{"lang":"pt","tmdbKey":"ci-fake-key","rules":[],"columns":[]}' | Set-Content "$dir\settings.json"
          Start-Process target\release\renome.exe
          Start-Sleep 20
          New-Item -ItemType Directory -Force shots | Out-Null
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $img = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($img).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $img.Save("shots\windows.png")
          Get-Content "$dir\settings.json"
          cmdkey /list | Select-String Renome
          if (Select-String -Quiet ci-fake-key "$dir\settings.json") { exit 1 }

      - uses: actions/upload-artifact@v7
        if: runner.os != 'Linux'
        continue-on-error: true
        with:
          name: shots-${{ runner.os }}
          path: shots
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v7
        with:
          name: renome-${{ runner.os }}
          path: |
            target/**/release/bundle/**/*.AppImage
            target/**/release/bundle/**/*.deb
            target/**/release/bundle/**/*.rpm
            target/**/release/bundle/**/*.msi
            target/**/release/bundle/**/*-setup.exe
            target/**/release/bundle/**/*.dmg
          if-no-files-found: ignore

  flatpak:
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Flatpak tools
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          # Ubuntu 24.04 keeps bubblewrap from making its sandbox otherwise.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Signing key
        env:
          FLATPAK_GPG_KEY: ${{ secrets.FLATPAK_GPG_KEY }}
        run: |
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -m 700 "$GNUPGHOME"
          echo "$FLATPAK_GPG_KEY" | gpg --batch --import
          key=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/{print $10; exit}')
          test -n "$key" || { echo "::error::secret FLATPAK_GPG_KEY is missing"; exit 1; }
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
          echo "KEY=$key" >> "$GITHUB_ENV"

      - name: Build the bundle
        run: |
          flatpak-builder --user --install-deps-from=flathub --disable-rofiles-fuse --force-clean \
            --default-branch=stable --gpg-sign="$KEY" --gpg-homedir="$GNUPGHOME" \
            --state-dir="$RUNNER_TEMP/fb-state" --repo="$RUNNER_TEMP/repo" \
            "$RUNNER_TEMP/build-dir" flatpak/io.github.rafaellgc.Renome.yml
          # The runtime comes from Flathub; updates come from our own repo.
          gpg --export "$KEY" > "$RUNNER_TEMP/key.gpg"
          flatpak build-bundle "$RUNNER_TEMP/repo" "Renome_${GITHUB_REF_NAME#v}_x86_64.flatpak" \
            io.github.rafaellgc.Renome stable --gpg-keys="$RUNNER_TEMP/key.gpg" \
            --repo-url=https://rafaellgc.github.io/Renome/repo/ \
            --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" Renome_*.flatpak --clobber

      # The repo is served from the gh-pages branch (GitHub Pages), one
      # commit holding the latest release only.
      - name: Publish the Flatpak repository
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          flatpak/publish-repo.sh "$RUNNER_TEMP/repo" "$GNUPGHOME" "$KEY" \
            "$RUNNER_TEMP/site" https://rafaellgc.github.io/Renome
          cd "$RUNNER_TEMP/site"
          git init -q -b gh-pages
          git add -A
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com \
            commit -qm "Flatpak repository for $GITHUB_REF_NAME"
          git push -f "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git" gh-pages

      - uses: actions/upload-artifact@v7
        with:
          name: renome-flatpak
          path: Renome_*.flatpak
